spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

management.prometheus.metrics.export.enabled=true

# Emit latency histogram buckets for HTTP server requests so Grafana can compute
# true p95/p99 per-URI (via histogram_quantile). Without this, http.server.requests
# is only a count/sum/max summary and no server-side percentiles are available.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=5ms,10ms,25ms,50ms,100ms,200ms,500ms,1s,2s

# Quieter logging for prod (override the dev DEBUG/show-sql in application.properties).
logging.level.org.springframework.web=DEBUG
spring.jpa.show-sql=false
