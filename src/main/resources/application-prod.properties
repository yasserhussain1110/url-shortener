spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

management.prometheus.metrics.export.enabled=true

# Quieter logging for prod (override the dev DEBUG/show-sql in application.properties).
logging.level.com.hussain.urlshortener=INFO
spring.jpa.show-sql=false

# Default pool of 10 saturated under spike load; MySQL had ample headroom (max_connections=151).
spring.datasource.hikari.maximum-pool-size=50

# OSIV held each connection for the whole request (through response serialization),
# starving the pool under write load. Off = connection released at end of transaction.
spring.jpa.open-in-view=false

# Fail fast under overload instead of pinning a Tomcat thread for 30s per stuck write.
spring.datasource.hikari.connection-timeout=5000